name: Deploy MySQL

on:
  push:
    branches:
      - main
    paths:
      - "database/**"
      - "k8s/mysql-*.yaml"
      - ".github/workflows/deploy-mysql.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: billmonitor
      REGION: asia-south1
      CLUSTER_NAME: jutecrm-gke
      CLUSTER_ZONE: asia-south1-a
      REPOSITORY: jutecrm
      IMAGE_NAME: mysql

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            $REGION-docker.pkg.dev \
            --quiet

      - name: Build MySQL Docker image
        run: |
          docker build \
            -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }} \
            ./database

      - name: Push MySQL Docker image
        run: |
          docker push \
            $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:${{ github.sha }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Create namespace
        run: |
          kubectl apply \
            -f k8s/namespace.yaml

      - name: Create MySQL secret
        run: |
          kubectl create secret generic mysql-secret \
            --namespace=jutecrm \
            --from-literal=MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --from-literal=MYSQL_USER="${{ secrets.DB_USER }}" \
            --from-literal=MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create MySQL PVC
        run: |
          kubectl apply \
            -f k8s/mysql-pvc.yaml

      - name: Prepare MySQL StatefulSet
        run: |
          sed -i \
            "s/IMAGE_TAG/${{ github.sha }}/g" \
            k8s/mysql-statefulset.yaml

      - name: Deploy MySQL
        run: |
          kubectl apply \
            -f k8s/mysql-statefulset.yaml \
            -f k8s/mysql-service.yaml

      - name: Wait for MySQL rollout
        run: |
          kubectl rollout status \
            statefulset/mysql \
            -n jutecrm \
            --timeout=300s

      - name: Check MySQL
        run: |
          echo "======================================"
          echo "MySQL StatefulSet"
          echo "======================================"

          kubectl get statefulset \
            -n jutecrm

          echo ""
          echo "======================================"
          echo "MySQL Pod"
          echo "======================================"

          kubectl get pods \
            -n jutecrm \
            -l app=mysql \
            -o wide

          echo ""
          echo "======================================"
          echo "MySQL Service"
          echo "======================================"

          kubectl get service \
            mysql \
            -n jutecrm

          echo ""
          echo "======================================"
          echo "MySQL PVC"
          echo "======================================"

          kubectl get pvc \
            mysql-pvc \
            -n jutecrm
