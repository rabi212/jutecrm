name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "k8s/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: billmonitor
      REGION: asia-south1
      CLUSTER_NAME: jutecrm-gke
      CLUSTER_ZONE: asia-south1-a
      REPOSITORY: jutecrm
      IMAGE_NAME: backend

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # 3. Setup Google Cloud CLI
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # 4. Configure Docker authentication
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      # 5. Build backend Docker image
      - name: Build Backend Docker Image
        run: |
          docker build -t ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${{ github.sha }} ./backend

      # 6. Push backend image to Artifact Registry
      - name: Push Backend Docker Image
        run: |
          docker push ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${{ github.sha }}

      # 7. Get GKE credentials
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      # 8. Create Kubernetes namespace
      - name: Create namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      # 9. Create / update backend Kubernetes secret
      - name: Create backend secret
        run: |
          kubectl create secret generic backend-secret \
            --namespace=jutecrm \
            --from-literal=DB_HOST=mysql \
            --from-literal=DB_PORT=3306 \
            --from-literal=DB_NAME="${{ secrets.DB_NAME }}" \
            --from-literal=DB_USER="${{ secrets.DB_USER }}" \
            --from-literal=DB_PASS="${{ secrets.DB_PASS }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # 10. Replace IMAGE_TAG with GitHub commit SHA
      - name: Prepare Kubernetes manifest
        run: |
          sed -i "s/IMAGE_TAG/${{ github.sha }}/g" k8s/backend-deployment.yaml

      # 11. Deploy backend to GKE
      - name: Deploy backend
        run: |
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml

      # 12. Verify deployment
      - name: Check deployment
        run: |
          echo "======================================"
          echo "Kubernetes Deployment"
          echo "======================================"

          kubectl get deployment jutecrm-backend -n jutecrm

          echo ""
          echo "======================================"
          echo "Pods"
          echo "======================================"

          kubectl get pods -n jutecrm -o wide

          echo ""
          echo "======================================"
          echo "Service"
          echo "======================================"

          kubectl get service -n jutecrm

          echo ""
          echo "======================================"
          echo "Backend Image"
          echo "======================================"

          kubectl get deployment jutecrm-backend \
            -n jutecrm \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""
